spring.application.name=studia
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/studia}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:studia}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:studia_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=true

spring.docker.compose.enabled=false

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:1.5b}

jwt.secret=${JWT_SECRET:studiaSecretKeyMustBeAtLeast256BitsLongForHMACSHA256StudiaApp}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
